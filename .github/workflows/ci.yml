name: Verify TrackIt

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: verify-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    verify:
        uses: ./.github/workflows/verify.yml
        with:
            ref: ${{ github.sha }}
            base_sha: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
