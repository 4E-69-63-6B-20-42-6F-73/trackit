name: Verify TrackIt

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    web-server:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: trackit
                    POSTGRES_USER: trackit
                    POSTGRES_PASSWORD: trackit-ci
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U trackit"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            DATABASE_URL: postgres://trackit:trackit-ci@127.0.0.1:5432/trackit
            BACKUP_DIR: ${{ github.workspace }}/backup-fixtures
            BACKUP_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
            TRACKIT_POSTGRES_INTEGRATION: 'true'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm run security:deps
            - run: npx playwright install --with-deps chromium firefox webkit
            - run: npm run test:e2e
            - run: npm run db:migrate
            - name: Install PostgreSQL client tools
              run: sudo apt-get update && sudo apt-get install --yes postgresql-client
            - name: Backup and clean restore drill
              run: bash scripts/restore-drill.sh
            - name: Build runtime container
              run: docker build --tag trackit-ci:test .
            - name: Scan container image
              uses: aquasecurity/trivy-action@0.33.1
              with:
                  scan-type: image
                  image-ref: trackit-ci:test
                  severity: CRITICAL,HIGH
                  exit-code: 1
            - name: Scan repository secrets
              uses: gitleaks/gitleaks-action@v2

    android:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17
                  cache: gradle
            - uses: android-actions/setup-android@v3
            - run: chmod +x android/gradlew
            - run: npm run test:android
            - uses: actions/upload-artifact@v4
              with:
                  name: trackit-android-debug
                  path: android/app/build/outputs/apk/debug/app-debug.apk
