name: Verify TrackIt

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    web-server:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: trackit
                    POSTGRES_USER: trackit
                    POSTGRES_PASSWORD: trackit-ci
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U trackit"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        env:
            DATABASE_URL: postgres://trackit:trackit-ci@127.0.0.1:5432/trackit
            BACKUP_DIR: ${{ github.workspace }}/backup-fixtures
            BACKUP_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
            TRACKIT_POSTGRES_INTEGRATION: 'true'

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - name: Static checks and unit tests
              run: npm run check

            - name: Dependency security audit
              run: npm run security:deps

            - name: Migrate database
              run: npm run db:migrate

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium firefox webkit

            - name: End-to-end tests
              run: npm run test:e2e

            - name: Install PostgreSQL 17 client tools
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes postgresql-common
                  sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
                  sudo apt-get update
                  sudo apt-get install --yes postgresql-client-17

            - name: Backup and clean restore drill
              run: bash scripts/restore-drill.sh

            - name: Build runtime container
              run: docker build --tag trackit-ci:test .

            - name: Scan container image
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  scan-type: image
                  image-ref: trackit-ci:test
                  severity: CRITICAL,HIGH
                  exit-code: 1

            - name: Scan repository secrets
              uses: gitleaks/gitleaks-action@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    android:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 17
                  cache: gradle

            - uses: android-actions/setup-android@v4

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: chmod +x android/gradlew

            - run: npm run test:android

            - uses: actions/upload-artifact@v7
              with:
                  name: trackit-android-debug
                  path: android/app/build/outputs/apk/debug/app-debug.apk
