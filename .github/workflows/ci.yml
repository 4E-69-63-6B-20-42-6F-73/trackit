name: Verify TrackIt

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    verify:
        if: >-
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name != github.repository
        uses: ./.github/workflows/verify.yml
        with:
            ref: ${{ github.sha }}
            base_sha: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
