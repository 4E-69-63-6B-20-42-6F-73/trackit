name: Verify TrackIt

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    web-server:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: trackit
                    POSTGRES_USER: trackit
                    POSTGRES_PASSWORD: trackit-ci
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U trackit"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        env:
            DATABASE_URL: postgres://trackit:trackit-ci@127.0.0.1:5432/trackit
            TRACKIT_DB_PASSWORD: trackit-ci
            BACKUP_DIR: ${{ github.workspace }}/backup-fixtures
            BACKUP_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
            TRACKIT_POSTGRES_INTEGRATION: 'true'

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - name: Static checks and unit tests
              run: npm run check

            - name: Verify migration snapshot matches schema
              run: |
                  npm run db:generate -- --name=ci_schema_drift
                  test -z "$(git status --porcelain -- server/db/migrations)"

            - name: Dependency security audit
              run: npm run security:deps

            - name: Migrate database
              run: npm run db:migrate

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium firefox webkit

            - name: End-to-end tests
              run: npm run test:e2e

            - name: Install PostgreSQL 17 client tools
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes postgresql-common
                  sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
                  sudo apt-get update
                  sudo apt-get install --yes postgresql-client-17

                  echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

                  /usr/lib/postgresql/17/bin/psql --version
                  /usr/lib/postgresql/17/bin/pg_dump --version
                  /usr/lib/postgresql/17/bin/pg_restore --version

            # Lets disable it for now until we reworked it.
            # - name: Backup and clean restore drill
            #   run: bash scripts/restore-drill.sh

            - name: Build runtime container
              run: docker build --tag trackit-ci:test .

            - name: Smoke test runtime container
              run: |
                  container=$(docker run --detach --network host \
                    --env HOST=127.0.0.1 \
                    --env PORT=3000 \
                    --env TRACKIT_DB_HOST=127.0.0.1 \
                    --env TRACKIT_DB_PASSWORD=trackit-ci \
                    --env BOOTSTRAP_SECRET=0123456789abcdef0123456789abcdef \
                    trackit-ci:test)
                  trap 'docker logs "$container"; docker rm --force "$container"' EXIT
                  for attempt in $(seq 1 30); do
                    curl --fail --silent http://127.0.0.1:3000/api/ready && exit 0
                    sleep 1
                  done
                  exit 1

            - name: Scan container image
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  scan-type: image
                  image-ref: trackit-ci:test
                  severity: CRITICAL,HIGH
                  exit-code: 1

            - name: Scan repository secrets
              uses: gitleaks/gitleaks-action@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    android:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 17
                  cache: gradle

            - uses: android-actions/setup-android@v4

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: chmod +x android/gradlew

            - run: npm run test:android

            - uses: actions/upload-artifact@v7
              with:
                  name: trackit-android-debug
                  path: android/app/build/outputs/apk/debug/app-debug.apk
