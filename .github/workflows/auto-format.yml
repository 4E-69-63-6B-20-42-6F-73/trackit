name: Auto-format pull request

on:
    pull_request:
        types: [opened, synchronize, reopened]

concurrency:
    group: auto-format-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    prettier:
        name: Prettier
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Require formatter credential
              env:
                  FORMATTER_TOKEN: ${{ secrets.FORMATTER_TOKEN }}
              run: |
                  if [ -z "$FORMATTER_TOKEN" ]; then
                    echo "FORMATTER_TOKEN must be configured as a repository Actions secret."
                    exit 1
                  fi
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  fetch-depth: 0
                  token: ${{ secrets.FORMATTER_TOKEN }}
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: Generate serving options migration
              run: npm run db:generate -- --name=food_serving_options
            - name: Format changed files
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- \
                    '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.json' \
                    '*.md' '*.css' '*.scss' '*.yaml' '*.yml' \
                    | xargs -0 -r npx --yes prettier@3.9.6 --write
            - name: Commit formatting and migration
              run: |
                  if ! git diff --quiet; then
                    git config user.name "trackit-formatter"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add --all
                    git commit -m "Generate food serving options migration"
                    git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
                  fi
