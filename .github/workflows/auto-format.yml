name: Auto-format pull request

on:
    pull_request:
        types: [opened, synchronize, reopened]

concurrency:
    group: auto-format-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: write
    actions: write

jobs:
    prettier:
        name: Prettier
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
            - name: Format changed files
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- \
                    '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.json' \
                    '*.md' '*.css' '*.scss' '*.yaml' '*.yml' \
                    | xargs -0 -r npx --yes prettier@3.9.6 --write
            - name: Commit formatting
              id: commit
              run: |
                  if git diff --quiet; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add --all
                  git commit -m "Format with Prettier"
                  git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
                  echo "changed=true" >> "$GITHUB_OUTPUT"
            - name: Verify formatted head
              if: steps.commit.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh workflow run ci.yml --ref "${{ github.event.pull_request.head.ref }}"
