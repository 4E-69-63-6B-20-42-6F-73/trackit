name: Format UX branch

on:
    push:
        branches:
            - feature/ux-journey-consolidation

permissions:
    contents: read

jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            - name: Require formatter token
              env:
                  FORMATTER_TOKEN: ${{ secrets.FORMATTER_TOKEN }}
              run: test -n "$FORMATTER_TOKEN"
            - uses: actions/checkout@v7
              with:
                  token: ${{ secrets.FORMATTER_TOKEN }}
                  ref: feature/ux-journey-consolidation
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run format
            - name: Commit formatted files
              run: |
                  if git diff --quiet; then
                    exit 0
                  fi
                  git config user.name "trackit-formatter"
                  git config user.email "trackit-formatter@users.noreply.github.com"
                  git add .
                  git commit -m "Format UX journey changes"
                  git push origin HEAD:feature/ux-journey-consolidation
