name: Generate meal planning migration

on:
    push:
        branches: [feature/meal-planning]

permissions:
    contents: read

jobs:
    generate:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Require formatter credential
              env:
                  FORMATTER_TOKEN: ${{ secrets.FORMATTER_TOKEN }}
              run: |
                  if [ -z "$FORMATTER_TOKEN" ]; then
                    exit 1
                  fi
            - uses: actions/checkout@v7
              with:
                  ref: feature/meal-planning
                  fetch-depth: 0
                  token: ${{ secrets.FORMATTER_TOKEN }}
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run db:generate -- --name=meal_planning
            - name: Commit generated migration
              run: |
                  if ! git diff --quiet -- server/db/migrations; then
                    git config user.name "trackit-migration-generator"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add server/db/migrations
                    git commit -m "Generate meal planning migration"
                    git push origin HEAD:feature/meal-planning
                  fi
