name: Apply one-shot UX lint fix

on:
    push:
        branches:
            - feature/ux-journey-consolidation

permissions:
    contents: read

jobs:
    fix:
        runs-on: ubuntu-latest
        steps:
            - name: Require formatter token
              env:
                  FORMATTER_TOKEN: ${{ secrets.FORMATTER_TOKEN }}
              run: test -n "$FORMATTER_TOKEN"
            - uses: actions/checkout@v7
              with:
                  token: ${{ secrets.FORMATTER_TOKEN }}
                  ref: feature/ux-journey-consolidation
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: Apply exact lint fixes
              run: |
                  python - <<'PY'
                  from pathlib import Path

                  journal = Path('src/pages/Journal.tsx')
                  text = journal.read_text()
                  old = """    useEffect(() => {\n        if (!selectedDate && !rangeFrom && !rangeTo && category === 'All') {\n            setBoundedEvents(null)\n            return\n        }\n        let active = true\n"""
                  new = """    const hasBoundedFilter = Boolean(\n        selectedDate || rangeFrom || rangeTo || category !== 'All',\n    )\n\n    useEffect(() => {\n        if (!hasBoundedFilter) return\n        let active = true\n"""
                  if old not in text:
                      raise SystemExit('Journal effect pattern not found')
                  text = text.replace(old, new, 1)
                  text = text.replace(
                      "    }, [category, rangeFrom, rangeTo, selectedDate, timezone])",
                      "    }, [category, hasBoundedFilter, rangeFrom, rangeTo, selectedDate, timezone])",
                      1,
                  )
                  text = text.replace(
                      "    const availableEvents = boundedEvents ?? events",
                      "    const availableEvents = hasBoundedFilter ? (boundedEvents ?? []) : events",
                      1,
                  )
                  journal.write_text(text)

                  today = Path('src/pages/Today.tsx')
                  text = today.read_text()
                  old = """    useEffect(() => {\n        if (!params.get('date')) setSelectedKeyState(todayKey)\n    }, [params, todayKey])\n\n"""
                  if old not in text:
                      raise SystemExit('Today effect pattern not found')
                  today.write_text(text.replace(old, '', 1))
                  PY
            - run: npm run format
            - name: Remove one-shot workflow and commit
              run: |
                  rm .github/workflows/ux-one-shot-lint-fix.yml
                  git config user.name "trackit-formatter"
                  git config user.email "trackit-formatter@users.noreply.github.com"
                  git add .
                  git commit -m "Fix UX journey lint regressions"
                  git push origin HEAD:feature/ux-journey-consolidation
