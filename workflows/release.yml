name: Build TrackIt release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: trackit
                    POSTGRES_USER: trackit
                    POSTGRES_PASSWORD: trackit-ci
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U trackit"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            DATABASE_URL: postgres://trackit:trackit-ci@127.0.0.1:5432/trackit
            BACKUP_DIR: ${{ github.workspace }}/backup-fixtures
            BACKUP_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
            TRACKIT_POSTGRES_INTEGRATION: 'true'
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 17
                  cache: gradle
            - uses: android-actions/setup-android@v3
            - run: npm ci
            - run: npm run check
            - run: npm run security:deps
            - run: npx playwright install --with-deps chromium firefox webkit
            - run: npm run test:e2e
            - run: npm run db:migrate
            - name: Install PostgreSQL client tools
              run: sudo apt-get update && sudo apt-get install --yes postgresql-client
            - name: Backup and clean restore release gate
              run: bash scripts/restore-drill.sh
            - name: Build and scan runtime container
              run: docker build --tag trackit-release-gate:test .
            - uses: aquasecurity/trivy-action@v0.36.0
              with:
                  scan-type: image
                  image-ref: trackit-release-gate:test
                  severity: CRITICAL,HIGH
                  exit-code: 1
            - name: Build container archive
              run: |
                  docker buildx create --use
                  docker buildx build --platform linux/amd64,linux/arm64 --output "type=oci,dest=trackit-${GITHUB_REF_NAME}-linux-amd64-arm64.oci.tar" .
                  gzip -9 "trackit-${GITHUB_REF_NAME}-linux-amd64-arm64.oci.tar"
            - name: Build Android release APK
              env:
                  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: |
                  test -n "$ANDROID_KEYSTORE_BASE64"
                  printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.jks
                  export ANDROID_KEYSTORE_PATH="$GITHUB_WORKSPACE/android/release.jks"
                  chmod +x android/gradlew
                  cd android
                  ./gradlew testDebugUnitTest assembleRelease
                  cp app/build/outputs/apk/release/app-release.apk "../trackit-companion-${GITHUB_REF_NAME}.apk"
            - name: Package self-hosting files and checksums
              run: |
                  tar -czf "trackit-${GITHUB_REF_NAME}-selfhost.tar.gz" \
                    Dockerfile .dockerignore compose.yaml .env.example \
                    package.json package-lock.json index.html \
                    tsconfig.json tsconfig.app.json tsconfig.node.json tsconfig.server.json \
                    vite.config.ts drizzle.config.ts src server scripts docs README.md CHANGELOG.md
                  sha256sum trackit-*.tar.gz trackit-companion-*.apk > SHA256SUMS
            - uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  files: |
                      trackit-${{ github.ref_name }}-linux-amd64-arm64.oci.tar.gz
                      trackit-${{ github.ref_name }}-selfhost.tar.gz
                      trackit-companion-${{ github.ref_name }}.apk
                      SHA256SUMS
