services:
    app:
        build: .
        restart: unless-stopped
        environment:
        HOST: 0.0.0.0
        PORT: 3000
        TRACKIT_DB_HOST: db
        TRACKIT_DB_PORT: 5432
        TRACKIT_DB_PASSWORD: ${TRACKIT_DB_PASSWORD:?Set TRACKIT_DB_PASSWORD in .env}
            WEB_ORIGIN: ${TRACKIT_ORIGIN:-http://localhost:3000}
            TRUST_PROXY: ${TRACKIT_TRUST_PROXY:-false}
            BACKUPS_ENABLED: ${TRACKIT_BACKUPS_ENABLED:-false}
            BACKUP_ENCRYPTION_KEY: ${TRACKIT_BACKUP_KEY:-}
            BACKUP_DIR: /backups
            BOOTSTRAP_SECRET: ${TRACKIT_BOOTSTRAP_SECRET:?Set TRACKIT_BOOTSTRAP_SECRET in .env}
        ports:
            - '${TRACKIT_BIND_ADDRESS:-127.0.0.1}:${TRACKIT_PORT:-3000}:3000'
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/api/health']
            interval: 10s
            timeout: 5s
            retries: 10
        volumes:
            - trackit-backups:/backups

    db:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: trackit
            POSTGRES_USER: trackit
            POSTGRES_PASSWORD: ${TRACKIT_DB_PASSWORD:?Set TRACKIT_DB_PASSWORD in .env}
        volumes:
            - trackit-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U trackit -d trackit']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    trackit-data:
    trackit-backups:
